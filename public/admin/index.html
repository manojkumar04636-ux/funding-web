<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA — Admin Panel Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-container {
      max-width: 450px;
      margin: 6rem auto;
      padding: 0 1.5rem;
    }
    .login-box {
      background-color: #FFF;
      border-radius: 28px;
      padding: 3rem 2rem;
      box-shadow: 0 20px 40px rgba(139, 92, 246, 0.1);
      border: 2px solid rgba(139, 92, 246, 0.05);
    }
  </style>
</head>
<body style="background-color: var(--light-bg);">

  <div class="login-container">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" class="logo" style="font-size: 2.2rem; justify-content: center;">
        <span>✨</span> NEXORA
      </a>
      <p style="color: #64748B; font-weight: 700; margin-top: 0.5rem;">Secure Portal Login</p>
    </div>

    <div class="login-box">
      <h2 style="font-family: var(--font-heading); font-weight: 800; font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; color: var(--dark-text);">
        🔑 Administrator Login
      </h2>

      <form id="admin-login-form">
        <div class="form-group">
          <label for="admin-user">Username:</label>
          <input type="text" id="admin-user" required placeholder="yuvraj9794" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="admin-pass">Password:</label>
          <input type="password" id="admin-pass" required placeholder="Enter admin password" autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 1.5rem;">
          🚀 LOG IN TO DASHBOARD
        </button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('admin-user').value;
      const password = document.getElementById('admin-pass').value;

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const result = await response.json();
        
        if (response.ok) {
          showToast('🎉 Login successful! Loading dashboard...');
          setTimeout(() => {
            window.location.href = '/admin/dashboard.html';
          }, 1000);
        } else {
          showToast(`⚠️ ${result.error || 'Authentication failed'}`);
        }
      } catch (err) {
        showToast('⚠️ Error connecting to server.');
      }
    });

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }
  </script>
</body>
</html>
