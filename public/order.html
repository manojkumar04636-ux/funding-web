<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA — Order Confirmed 🎉</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .order-success-card {
      max-width: 650px;
      margin: 4rem auto;
      background: #FFF;
      border-radius: 32px;
      padding: 3.5rem 2.5rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(139, 92, 246, 0.12);
      border: 3px solid transparent;
      background-image: linear-gradient(white, white), var(--gradient-purple-pink);
      background-origin: border-box;
      background-clip: padding-box, border-box;
    }
    .download-section {
      margin-top: 2.5rem;
      text-align: left;
      background-color: var(--light-bg);
      padding: 2rem;
      border-radius: 20px;
      border: 1.5px dashed rgba(139, 92, 246, 0.2);
    }
    .download-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid rgba(139, 92, 246, 0.08);
    }
    .download-item:last-child {
      border-bottom: none;
    }
    .btn-download {
      background: var(--gradient-green-blue);
      color: #fff;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 99px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.25);
      transition: all 0.2s;
    }
    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4);
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
      color: #475569;
    }
  </style>
</head>
<body style="background-color: var(--light-bg);">

  <!-- Simple Header -->
  <header style="padding: 1rem 0;">
    <div class="nav-container">
      <a href="/" class="logo" style="font-size: 1.5rem;">
        <span>✨</span> NEXORA
      </a>
      <a href="/" class="btn-secondary" style="padding: 0.5rem 1.2rem; font-size: 0.9rem;">🏠 Back to Store</a>
    </div>
  </header>

  <div class="checkout-container">
    <div class="order-success-card" id="success-card">
      <div style="font-size: 5rem; margin-bottom: 1.5rem;">🎉</div>
      <h1 class="sec-title" style="font-size: 2.5rem; margin-bottom: 0.5rem;">PAYMENT VERIFIED!</h1>
      <p style="color: #64748B; font-size: 1.1rem; margin-bottom: 2.5rem;">
        Thank you for purchasing! Your payment has been approved and files are ready.
      </p>

      <div style="text-align: left; margin: 1.5rem 0; padding-bottom: 1rem; border-bottom: 2px solid rgba(139, 92, 246, 0.08);">
        <div class="info-row">
          <span>Order ID:</span>
          <strong id="order-id" style="color: var(--purple);">NEX-XXXX</strong>
        </div>
        <div class="info-row">
          <span>Customer:</span>
          <span id="customer-name">-</span>
        </div>
        <div class="info-row">
          <span>Amount Paid:</span>
          <strong id="amount-paid">₹0</strong>
        </div>
        <div class="info-row">
          <span>Status:</span>
          <span id="status-badge" style="background: rgba(16, 185, 129, 0.1); color: var(--green); padding: 0.2rem 0.8rem; border-radius: 99px; font-weight: 800; font-size: 0.85rem;">PAID</span>
        </div>
      </div>

      <!-- Secure Downloads Section -->
      <div class="download-section">
        <h3 style="font-weight:800; margin-bottom: 1.2rem; font-size: 1.15rem; color: var(--dark-text); text-align: center;">
          📥 DOWNLOAD YOUR BUNDLES
        </h3>
        <div id="downloads-list">
          <!-- Filled dynamically with download items -->
        </div>
      </div>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a id="whatsapp-support-btn" href="https://wa.me/91979414912" target="_blank" class="btn-whatsapp" style="justify-content: center; font-size: 0.95rem;">
          💬 NEED HELP? CHAT ON WHATSAPP
        </a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadOrderDetails();
    });

    async function loadOrderDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('id');

      if (!orderId) {
        showToast('⚠️ No Order ID found!');
        setTimeout(() => { window.location.href = '/'; }, 2000);
        return;
      }

      try {
        const response = await fetch(`/api/orders/${orderId}`);
        if (!response.ok) {
          showToast('⚠️ Order not found!');
          setTimeout(() => { window.location.href = '/'; }, 2000);
          return;
        }

        const order = await response.json();

        // Check if Paid, if not redirect to checkout status polling
        if (order.payment_status !== 'PAID') {
          showToast('⚠️ Payment not verified yet!');
          setTimeout(() => { window.location.href = `/checkout.html`; }, 2000);
          return;
        }

        // Fill layout
        document.getElementById('order-id').textContent = order.id;
        document.getElementById('customer-name').textContent = order.customer_name;
        document.getElementById('amount-paid').textContent = `₹${order.total_amount}`;

        // Populate Download Items
        const downloadsContainer = document.getElementById('downloads-list');
        downloadsContainer.innerHTML = '';

        // Check if order's download access is revoked
        if (order.download_revoked === 1) {
          downloadsContainer.innerHTML = `
            <div style="color: #EF4444; font-size: 0.95rem; font-weight: bold; background: #FEE2E2; padding: 1.2rem; border-radius: 12px; border: 1px solid #FCA5A5; text-align: center; line-height: 1.5; margin-top: 1rem;">
              ⚠️ Download access has been temporarily disabled. Contact NEXORA support.
            </div>
          `;
        } else {
          order.items.forEach(item => {
            if (item.selection && item.selection.length > 0) {
              // Packages containing selections
              item.selection.forEach(selSlug => {
                const status = order.product_statuses[selSlug] || 'NOT CONFIGURED';
                const cleanTitle = selSlug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                downloadsContainer.insertAdjacentHTML('beforeend', createDownloadItemHtml(order.id, selSlug, cleanTitle, status));
              });
            } else {
              // Single purchased files or bundles
              const status = order.product_statuses[item.slug] || 'NOT CONFIGURED';
              downloadsContainer.insertAdjacentHTML('beforeend', createDownloadItemHtml(order.id, item.slug, item.title, status));
            }
          });
        }

        // Populate WhatsApp button
        const itemsList = order.items.map(i => i.title).join(', ');
        const downloadStatuses = order.items.map(i => {
          const status = order.product_statuses[i.slug] || 'NOT CONFIGURED';
          return `${i.title}: ${status}`;
        }).join(', ');

        const waText = encodeURIComponent(
          `Hello NEXORA 👋\n\n` +
          `I need help with my order.\n\n` +
          `Order ID: ${order.id}\n` +
          `Product: ${itemsList}\n` +
          `Payment Status: ${order.payment_status}\n` +
          `Download Status: ${order.download_revoked ? 'REVOKED' : downloadStatuses}\n\n` +
          `Please help me with my order.`
        );
        document.getElementById('whatsapp-support-btn').href = `https://wa.me/91979414912?text=${waText}`;

      } catch (err) {
        showToast('⚠️ Connection error.');
      }
    }

    function createDownloadItemHtml(orderId, slug, title, status) {
      let downloadControl = '';
      if (status === 'READY') {
        downloadControl = `
          <a href="/api/download/${orderId}/${slug}" class="btn-download" target="_blank" style="display:inline-flex; align-items:center; justify-content:center; width:100%; margin-top:0.4rem; padding: 0.8rem 1.2rem; font-size: 1rem; border-radius: 12px; font-weight:800; letter-spacing:0.02em; background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);">
            📥 DOWNLOAD YOUR BUNDLE
          </a>
        `;
      } else if (status === 'DISABLED') {
        downloadControl = `
          <div style="color: #EF4444; font-size: 0.85rem; font-weight: bold; background: #FEE2E2; padding: 0.8rem 1.2rem; border-radius: 10px; border: 1px solid #FCA5A5; line-height: 1.4; margin-top: 0.4rem;">
            ⚠️ Download temporarily unavailable. Contact NEXORA support.
          </div>
        `;
      } else {
        // NOT CONFIGURED
        downloadControl = `
          <div style="color: var(--purple); font-size: 0.85rem; font-weight: bold; background: rgba(139,92,246,0.06); padding: 0.8rem 1.2rem; border-radius: 10px; border: 1px dashed var(--purple); line-height: 1.4; margin-top: 0.4rem;">
            ⏳ Download is being prepared. Your payment is confirmed. Your download is being prepared. Please contact support.
          </div>
        `;
      }

      return `
        <div class="download-item" style="padding: 1.2rem; margin-bottom: 1.2rem; border-radius: 16px; border: 1px solid rgba(139,92,246,0.08); display:flex; flex-direction:column; gap:0.6rem; background:#fff; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; border-bottom: 1px solid rgba(139,92,246,0.05); padding-bottom: 0.6rem;">
            <div>
              <div style="font-weight: 800; font-size: 1.05rem; color: var(--dark-text);">${title}</div>
              <div style="font-size: 0.75rem; color: #64748B; margin-top: 0.15rem;">Standard Package</div>
            </div>
            <div style="font-size: 0.8rem; color: #64748B; font-weight: bold; background: rgba(139,92,246,0.05); padding: 0.2rem 0.6rem; border-radius: 99px;">
              Status: <span style="color: var(--purple); font-weight: 800;">${status}</span>
            </div>
          </div>
          <div>
            ${downloadControl}
          </div>
        </div>
      `;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }
  </script>
</body>
</html>
